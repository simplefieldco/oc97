<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Oak Cliff '97 · Pad</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#140a1c;color:#fff;font-family:'Press Start 2P',monospace;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;box-sizing:border-box}
h1{font-size:20px;color:#ffd23f;text-shadow:3px 3px 0 #c2185b;margin:0 0 18px;font-weight:normal;line-height:1.4}
input{font:inherit;font-size:16px;width:200px;padding:12px;text-align:center;text-transform:uppercase;border:3px solid #fff;background:#000;color:#ffd23f;margin-bottom:16px}
button{font:inherit;font-size:14px;color:#000;background:#ffd23f;border:3px solid #fff;padding:14px 18px;box-shadow:4px 4px 0 #000}
#st{font-size:9px;color:#7ef9ff;margin-top:16px;line-height:16px}
#pad{display:none}
#me{position:fixed;top:12px;left:0;right:0;text-align:center;font-size:14px}
#sc{position:fixed;top:36px;left:0;right:0;text-align:center;font-size:9px;color:#ddd}
#zone{position:fixed;left:0;top:60px;bottom:0;width:62%}
#base{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:3px dashed rgba(255,255,255,.5);left:50%;top:55%}
#knob{position:absolute;left:45px;top:45px;width:60px;height:60px;border-radius:50%;background:#ffd23f;border:3px solid #fff}
#run{position:fixed;right:24px;top:55%;width:110px;height:110px;margin-top:-55px;border-radius:50%;font-size:14px;padding:0;background:#ff4fa0;color:#fff}
#run.on{background:#fff;color:#ff4fa0}
#go{position:fixed;right:24px;bottom:20px;font-size:9px;padding:8px 10px}
#hint{position:fixed;bottom:20px;left:0;width:62%;text-align:center;font-size:7px;color:#9a8ab8}
</style>
</head>
<body>
<div class="scr" id="lobby">
<h1>OAK CLIFF '97<br>CONTROLLER</h1>
<input id="nm" maxlength="6" placeholder="NAME" autocomplete="off">
<button id="join">JOIN</button>
<div id="st"></div>
</div>
<div id="pad">
<div id="me"></div><div id="sc">TAPES 0</div>
<div id="zone"><div id="base"><div id="knob"></div></div></div>
<div id="hint">DRAG ANYWHERE ON THE LEFT</div>
<button id="run">RUN</button>
<button id="go">START</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const ROOM=(location.hash.slice(1)||'').toUpperCase().replace(/[^A-Z]/g,'');
const st=$('st');
$('nm').value=localStorage.getItem('oc97name')||'';
if(!ROOM){st.textContent='NO ROOM CODE. SCAN THE QR ON THE TV.';$('join').disabled=true;}
let kicked=false,peer,conn,inp={x:0,y:0,r:false},dirty=true;
function connect(){
  const name=($('nm').value||'').trim().toUpperCase().slice(0,6);localStorage.setItem('oc97name',name);
  st.textContent='CONNECTING TO '+ROOM+'...';
  if(!peer||peer.destroyed){peer=new Peer();peer.on('error',e=>{st.textContent='ERROR: '+(e.type||e)+'. TAP JOIN TO RETRY.';});}
  const go=()=>{conn=peer.connect('oc97-'+ROOM,{reliable:false});
    conn.on('open',()=>{conn.send({t:'hi',name});$('lobby').style.display='none';$('pad').style.display='block';});
    conn.on('data',d=>{if(d.t==='you'){$('me').textContent=d.name;$('me').style.color=d.css;$('knob').style.background=d.css;}
      if(d.t==='score'){$('sc').textContent='TAPES '+d.tapes+(d.win?' · '+d.win+' WINS!':'');$('sc').style.color='';if(d.idle!=null&&d.idle<=15){$('sc').textContent='MOVE OR GET BOOTED: '+d.idle+'S';$('sc').style.color='#ff4fa0';if(navigator.vibrate)navigator.vibrate(40);}}
      if(d.t==='kick'){kicked=true;}
      if(d.t==='bit'){if(navigator.vibrate)navigator.vibrate([120,60,220]);document.body.animate([{background:'#b00010'},{background:'#140a1c'}],{duration:600});}});
    conn.on('close',()=>{$('pad').style.display='none';$('lobby').style.display='flex';st.textContent=kicked?'REMOVED FOR INACTIVITY. TAP JOIN TO PLAY AGAIN.':'DISCONNECTED. TAP JOIN.';kicked=false;});
  };
  if(peer.open)go();else peer.once('open',go);
}
$('join').onclick=connect;
// joystick: floating, anywhere in the left zone
const zone=$('zone'),base=$('base'),knob=$('knob');let jid=null,ox=0,oy=0;const M=60;
zone.addEventListener('pointerdown',e=>{jid=e.pointerId;ox=e.clientX;oy=e.clientY;const r=zone.getBoundingClientRect();base.style.left=(ox-r.left)+'px';base.style.top=(oy-r.top)+'px';zone.setPointerCapture(e.pointerId);move(e);});
zone.addEventListener('pointermove',move);
function move(e){if(e.pointerId!==jid)return;let dx=e.clientX-ox,dy=e.clientY-oy;const L=Math.hypot(dx,dy);if(L>M){dx*=M/L;dy*=M/L;}knob.style.transform=`translate(${dx}px,${dy}px)`;inp.x=+(dx/M).toFixed(2);inp.y=+(dy/M).toFixed(2);dirty=true;}
function end(e){if(e.pointerId!==jid)return;jid=null;inp.x=inp.y=0;knob.style.transform='';dirty=true;}
zone.addEventListener('pointerup',end);zone.addEventListener('pointercancel',end);
const run=$('run');
run.addEventListener('pointerdown',e=>{e.preventDefault();inp.r=true;run.classList.add('on');dirty=true;if(navigator.vibrate)navigator.vibrate(15);});
['pointerup','pointercancel','pointerleave'].forEach(k=>run.addEventListener(k,()=>{inp.r=false;run.classList.remove('on');dirty=true;}));
$('go').onclick=()=>{if(conn&&conn.open)conn.send({t:'start'});};
// send on change, plus a 10 Hz heartbeat so a dropped packet never leaves you stuck walking
let last=0;(function tick(t){requestAnimationFrame(tick);if(!conn||!conn.open)return;if(dirty||t-last>100){conn.send({t:'in',x:inp.x,y:inp.y,r:inp.r});dirty=false;last=t;}})(0);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&conn&&conn.open){inp={x:0,y:0,r:false};conn.send({t:'in',x:0,y:0,r:false});}});
</script>
</body>
</html>
